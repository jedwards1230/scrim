# Reproduces the homelab deployment this chart replaces. Used by `helm template`
# in CI to prove the chart still renders that configuration.
hub:
  # The volume mounts at /data but canvases live in the /data/hub SUBDIRECTORY.
  # The Longhorn volume root is root-owned, and the hub chmods its data dir to
  # 0700 at startup — which it can only do to a directory it owns. Mounting at
  # the root would fail that chmod, and would also look for canvases one level
  # too deep. These two values must not be collapsed.
  dataDir: /data/hub
  persistence:
    mountPath: /data
    # Homelab-specific: the chart default is empty (cluster default class).
    storageClass: longhorn
  oidc:
    issuer: https://sso.lilbro.cloud/realms/homelab
    clientId: scrim-hub
    redirectUrl: https://scrim.lilbro.cloud/auth/callback
  ingress:
    enabled: true
    host: scrim.lilbro.cloud
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-lan@kubernetescrd
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Scrim
      gethomepage.dev/description: Live canvas surface for coding agents
      gethomepage.dev/group: AI & Agents
      gethomepage.dev/icon: mdi-projector-screen
    tls:
      secretName: scrim-hub-tls

mcp:
  hubPublicUrl: https://scrim.lilbro.cloud
  oauth:
    # Today this is the facade host. Phase 4 repoints it at the Keycloak realm
    # and deletes the facade.
    issuer: https://scrim-mcp.lilbro.cloud/application/o/scrim-mcp/
    audience: scrim-mcp

onePassword:
  enabled: true

networkPolicy:
  enabled: true
