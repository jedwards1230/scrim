# Validates the PR's release-intent label: at most one semver:* label.
#
# No label is allowed. release.yml then decides from the diff: a PR whose
# changed files are ALL dev-only (CI, tests, docs, linter config, agent
# instructions) does not release; anything else releases as patch. An explicit
# label always wins -- semver:none forces no release, major|minor|patch forces
# that bump. Two labels would be resolved by priority (major > minor > patch)
# and could silently turn semver:none into a release, so that stays an error.
#
# Also emits a NON-BLOCKING warning when a PR carries semver:major|minor|patch
# but every changed file is dev-only: the label forces a release the diff alone
# would not have cut.
name: Semver label

on:
  pull_request:
    # `labeled`/`unlabeled` matter as much as the code events: adding the label
    # is usually what FIXES a failing run, so the check has to re-evaluate on a
    # label change or it stays red with nothing to push.
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  # Lists the PR's changed files for the dev-only warning below.
  pull-requests: read

concurrency:
  group: semver-label-${{ github.event.pull_request.number }}
  # Labelling a PR right after opening it supersedes the first (label-less,
  # certain-to-fail) run. Expect to see that CANCELLED run linger next to the
  # passing one: GitHub evaluates the most recent run per check name, so merges
  # are unaffected, but aggregators that count cancelled as failed (ci-watch
  # among them) will report a phantom failure. `gh pr checks <pr>` shows the
  # authoritative per-check state.
  cancel-in-progress: true

jobs:
  check:
    name: Release intent declared
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver:* labels
        env:
          # Rendered from the event payload rather than fetched, so the check
          # reflects the labels that triggered this run. Passed through env to
          # keep PR-controlled text out of the shell's parse step.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Dev-only paths -- KEEP IN SYNC with the DEV_ONLY list in the
          # `detect` step of release.yml. Patterns are bash [[ == ]] globs, where
          # `*` also matches `/`. Anything not listed counts as product.
          DEV_ONLY=(
            '.github/*'
            '.claude/*'
            'CLAUDE.md'
            'AGENTS.md'
            '*/CLAUDE.md'
            '*/AGENTS.md'
            'CONTRIBUTING*'
            'docs/*'
            '*_test.go'
            '*/testdata/*'
            'scripts/e2e.sh'
            'scripts/check-plugin-versions.sh'
            'Makefile'
            '.golangci*'
            '.pre-commit-config.yaml'
            '.editorconfig'
            '.gitignore'
          )
          is_dev_only() {
            local p
            for p in "${DEV_ONLY[@]}"; do
              # shellcheck disable=SC2053 # unquoted on purpose: $p is a glob
              [[ $1 == $p ]] && return 0
            done
            return 1
          }

          echo "Labels on this PR: ${LABELS:-<none>}"

          matched=""
          for want in major minor patch none; do
            # Comma-delimit both sides so `semver:none` cannot substring-match
            # inside some future `semver:none-really` label.
            case ",${LABELS}," in
              *",semver:${want},"*) matched="${matched} semver:${want}" ;;
            esac
          done
          matched="${matched# }"
          count=$(printf '%s' "$matched" | wc -w | tr -d ' ')

          if [ "$count" -gt 1 ]; then
            echo "::error::conflicting release intent: ${matched}"
            echo ""
            echo "This PR carries more than one semver:* label. release.yml resolves"
            echo "them in priority order (major > minor > patch), so an accidental"
            echo "extra label would silently outrank the one you meant -- including"
            echo "overriding semver:none into a real release. Leave at most one."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            echo "::notice::no semver:* label -- release.yml will decide from the changed files (all dev-only: no release; otherwise patch)"
            exit 0
          fi

          echo "::notice::release intent: ${matched}"

          # Non-blocking: warn when a forcing label sits on a dev-only diff.
          if [ "$matched" = "semver:none" ]; then exit 0; fi
          if ! FILES=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null) || [ -z "$FILES" ]; then
            echo "::warning::could not list changed files -- skipped the dev-only check"
            exit 0
          fi
          while IFS= read -r f; do
            if ! is_dev_only "$f"; then exit 0; fi
          done <<< "$FILES"
          msg="this diff is dev-only; semver:none (or no label) would skip the release (${matched} forces one)"
          echo "::warning::${msg}"
          echo "**Warning:** ${msg}" >> "$GITHUB_STEP_SUMMARY"
