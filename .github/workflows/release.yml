# Single-file release pipeline (modeled on jedwards1230/deck's release.yml).
#
# Triggered on push to main (or manual dispatch). A `detect` job decides whether
# the merged PR warrants a release:
#   1. An explicit semver:major|minor|patch label always wins (that bump);
#      semver:none always means no release -- even if the diff is dev-only.
#   2. No label: the PR's changed files decide. If EVERY changed file is
#      dev-only (CI, tests, linter config, docs, agent instructions -- see
#      .github/.releaseignore, gitignore syntax) there is no release; otherwise
#      patch.
#   3. No usable file classification (no associated PR / direct push, the
#      changed-files lookup fails or is empty, or the matcher errors): release
#      as patch with a ::warning:: -- a missed release is invisible, an extra
#      one is harmless. (semver:none still wins whenever labels were read.)
#   4. workflow_dispatch always releases.
# When a release is warranted it delegates version compute, tag
# creation, and AI release notes to the shared
# jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1, then
# cross-builds the Go binaries (5 platforms), builds and pushes a multi-arch
# container image to GHCR, and publishes the GitHub Release. The release job
# also attaches an aggregate SHA256SUMS manifest and a keyless cosign signature
# over it (Sigstore, via the job's GitHub OIDC identity) as a single
# SHA256SUMS.cosign.bundle.
#
# The git tag is the single source of truth: the build/image jobs check out the
# TAGGED commit and stamp the computed version into the binaries (via -ldflags)
# and the image (via Docker build-args) — no file edit, nothing pushed back to
# main. The image job runs in parallel with build (it needs only detect +
# prepare), so a slow image push never blocks the GitHub Release.
name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release: {0}{1}', inputs.dry_run && 'dry-run ' || '', inputs.bump_type)
      || format('Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Compute version + preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # ai-release.yml@v1 reads merged PRs for the changelog and the detect job runs
  # `gh pr list` — both need pull-requests:read. A restricted permissions block
  # defaults every unlisted scope to none, so grant it explicitly.
  pull-requests: read

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      bump_type: ${{ steps.bump.outputs.type }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
      release: ${{ steps.bump.outputs.release }}
    steps:
      # Only the dev-only path list is needed; sparse so detect stays cheap.
      - name: Checkout release ignore list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/.releaseignore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.bump_type }}"
            DRY="${{ inputs.dry_run }}"
            RELEASE="true"
          else
            # Look up the PR associated with this exact commit directly (a
            # targeted commit->PR lookup, not a list+client-side-filter), so the
            # merged PR can never fall outside a paginated window. The PR may not
            # be indexed yet right after the push, so retry only while it is
            # still missing; labels are read from the same response.
            PR_NUMBER=""
            LABELS=""
            for attempt in 1 2 3; do
              # One call yields both the PR number and its labels, so a failed
              # second lookup can never leave a found PR looking label-less
              # (which would let an explicit semver:none fall through to the
              # files rule). Output: first line = number, rest = label names.
              # shellcheck disable=SC2016 # $ENV.GITHUB_SHA is jq's own env-var
              # syntax, not a bash variable -- must stay single-quoted so bash
              # doesn't expand it before jq sees it.
              PR_INFO=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[] | select(.merge_commit_sha == $ENV.GITHUB_SHA)] | first | select(. != null) | (.number | tostring), (.labels[].name)' 2>/dev/null || echo "")
              if [ -n "$PR_INFO" ]; then
                PR_NUMBER=$(printf '%s\n' "$PR_INFO" | head -n 1)
                LABELS=$(printf '%s\n' "$PR_INFO" | tail -n +2)
                break
              fi
              echo "Attempt ${attempt}: no PR for ${GITHUB_SHA} yet, retrying in 5s..."
              sleep 5
            done
            echo "PR for ${GITHUB_SHA}: ${PR_NUMBER:-<none>}; labels: ${LABELS:-<none>}"
            DRY="false"
            if [ -z "$PR_NUMBER" ]; then
              TYPE="patch"; RELEASE="true"
              echo "::warning::no merged PR found for ${GITHUB_SHA} (direct push, or the lookup failed) — cannot classify the diff, releasing as patch."
            elif echo "$LABELS" | grep -qx 'semver:major'; then
              TYPE="major"; RELEASE="true"
            elif echo "$LABELS" | grep -qx 'semver:minor'; then
              TYPE="minor"; RELEASE="true"
            elif echo "$LABELS" | grep -qx 'semver:patch'; then
              TYPE="patch"; RELEASE="true"
            elif echo "$LABELS" | grep -qx 'semver:none'; then
              # An explicit "no release" is a different fact from a missing
              # label, even though both skip. Distinguishing them means a
              # skipped run's log says whether that was intended.
              TYPE="none"; RELEASE="false"
              echo "::notice::semver:none on PR #${PR_NUMBER} — no release, as declared"
            elif ! FILES=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null) || [ -z "$FILES" ]; then
              TYPE="patch"; RELEASE="true"
              echo "::warning::no semver:* label on PR #${PR_NUMBER} and its changed files could not be listed (or the list is empty) — cannot classify the diff, releasing as patch."
            else
              # No label: the changed files decide (previous_filename is included
              # above so a rename OUT of a product path still counts as product).
              # Dev-only paths live in .github/.releaseignore (gitignore syntax),
              # matched by git's own engine in a throwaway empty repo so no other
              # ignore source leaks in. Missing/empty file => nothing is dev-only.
              RELEASEIGNORE="${GITHUB_WORKSPACE}/.github/.releaseignore"
              mapfile -t FILE_LIST < <(printf '%s\n' "$FILES" | sort -u)
              MATCHED=()
              CHECK_RC=0
              if [ -s "$RELEASEIGNORE" ]; then
                # Any setup failure counts as a matcher error (CHECK_RC > 1).
                SCRATCH=$(mktemp -d) || CHECK_RC=99
                if [ "$CHECK_RC" -le 1 ]; then
                  git init -q "$SCRATCH" || CHECK_RC=99
                fi
                if [ "$CHECK_RC" -le 1 ]; then
                  printf '%s\0' "${FILE_LIST[@]}" > "${SCRATCH}.paths" || CHECK_RC=99
                fi
                if [ "$CHECK_RC" -le 1 ]; then
                  git -C "$SCRATCH" -c core.excludesFile="$RELEASEIGNORE" \
                    check-ignore --no-index -z --stdin < "${SCRATCH}.paths" > "${SCRATCH}.matched" || CHECK_RC=$?
                fi
                # rc: 0 = some matched, 1 = none matched, anything else = error
                if [ "$CHECK_RC" -le 1 ]; then
                  mapfile -d '' MATCHED < "${SCRATCH}.matched" || CHECK_RC=99
                fi
              else
                echo "::notice::.github/.releaseignore is missing or empty -- no path counts as dev-only"
              fi
              if [ "$CHECK_RC" -gt 1 ]; then
                TYPE="patch"; RELEASE="true"
                echo "::warning::git check-ignore failed (rc=${CHECK_RC}) on PR #${PR_NUMBER} -- cannot classify the diff, releasing as patch."
              else
                declare -A IS_DEV=()
                for f in "${MATCHED[@]}"; do IS_DEV["$f"]=1; done
                FIRST_PRODUCT=""
                for f in "${FILE_LIST[@]}"; do
                  if [ -z "${IS_DEV[$f]+x}" ]; then FIRST_PRODUCT="$f"; break; fi
                done
                if [ -n "$FIRST_PRODUCT" ]; then
                  TYPE="patch"; RELEASE="true"
                  echo "::notice::no semver:* label on PR #${PR_NUMBER} — releasing as patch; first non-dev-only file: ${FIRST_PRODUCT}"
                else
                  TYPE="none"; RELEASE="false"
                  echo "::notice::dev-only rule fired on PR #${PR_NUMBER} — no release (${#FILE_LIST[@]} changed path(s), all dev-only; first: $(printf '%s\n' "${FILE_LIST[@]}" | head -n 3 | paste -sd, -))"
                fi
              fi
            fi
          fi
          # Defensive: make sure a future label-parsing bug can't silently
          # propagate an unexpected value downstream.
          case "$TYPE" in
            major | minor | patch | none) ;;
            *)
              echo "::error::invalid bump type computed: $TYPE"
              exit 1
              ;;
          esac
          {
            echo "type=$TYPE"
            echo "dry_run=$DRY"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@b185a6e7822f9c36822ed8e89e77b3d0fe229f96 # v1
    with:
      service_name: scrim
      service_description: "an agent-canvas projection daemon with SSE live-reload"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
      create_release: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: Build cross-platform binaries
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X github.com/jedwards1230/scrim/internal/version.Version=${VERSION} \
                   -X github.com/jedwards1230/scrim/internal/version.Commit=${COMMIT} \
                   -X github.com/jedwards1230/scrim/internal/version.Date=${DATE}"
          mkdir -p dist
          # NOTE: if this list changes, update the "Binaries" line in the
          # "Write workflow summary" step below to match.
          platforms=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"; GOARCH="${platform#*/}"
            output="scrim-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then output="${output}.exe"; fi
            echo "Building ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}" .
          done
          ls -lh dist/

      - name: Upload binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrim-binaries
          path: dist/*
          if-no-files-found: error

  image:
    name: Build & push container image
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job (not the workflow) — the repo's default GITHUB_TOKEN
      # is read-only, so pushing to GHCR needs packages:write here. contents:read
      # is enough to check out the tagged source for the image build.
      contents: read
      packages: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Compute build metadata
        id: buildmeta
        run: |
          set -euo pipefail
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jedwards1230/scrim
          # This job runs on push:main, so github.ref is a branch, not the tag —
          # feed metadata-action the computed release tag explicitly so it can
          # derive the semver labels (X.Y.Z, X.Y) from it.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
          # org.opencontainers.image.source links the GHCR package to the repo
          # (Packages UI + provenance). metadata-action would derive it anyway,
          # but pin it explicitly so the link never depends on autodetection.
          labels: |
            org.opencontainers.image.source=https://github.com/jedwards1230/scrim
            org.opencontainers.image.title=scrim
            org.opencontainers.image.description=scrim hub — a shared canvas host that serves agent-authored HTML with SSE live-reload

      - name: Build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ steps.buildmeta.outputs.commit }}
            DATE=${{ steps.buildmeta.outputs.date }}
          # No provenance/SBOM attestations: they add an extra "unknown/unknown"
          # manifest entry to the multi-arch index that clutters the GHCR
          # package listing without value for this internal image.
          provenance: false

      - name: Write workflow summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Container image"
            echo ""
            echo "Pushed \`ghcr.io/jedwards1230/scrim\` (linux/amd64, linux/arm64):"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Package & push Helm chart
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Same scoping rationale as the image job: the default GITHUB_TOKEN is
      # read-only, so pushing the OCI chart to GHCR needs packages:write here.
      contents: read
      packages: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Stamp chart version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The git tag is the single source of truth (same rule the binaries and
          # image follow): stamp both chart version and appVersion from it rather
          # than hand-editing Chart.yaml on main. Nothing is pushed back.
          sed -i -E "s/^version: .*/version: ${VERSION}/" deploy/charts/scrim/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/charts/scrim/Chart.yaml
          grep -E '^(version|appVersion):' deploy/charts/scrim/Chart.yaml

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint deploy/charts/scrim
          # Render both the defaults and the real-world values file. A chart that
          # lints but cannot render its own documented configuration is not green.
          helm template scrim deploy/charts/scrim --namespace scrim >/dev/null
          helm template scrim deploy/charts/scrim --namespace scrim \
            -f deploy/charts/scrim/ci/homelab-values.yaml >/dev/null

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package & push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          helm package deploy/charts/scrim --destination dist
          helm push "dist/scrim-${VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
          echo "::notice::pushed oci://ghcr.io/${{ github.repository_owner }}/charts/scrim:${VERSION}"

  release:
    name: Create GitHub Release
    needs: [detect, prepare, build]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing mints a short-lived Fulcio cert from the job's
      # GitHub OIDC identity — that needs id-token:write. Scoped to this job
      # only (the workflow default stays contents:write).
      id-token: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scrim-binaries
          path: dist

      # Aggregate checksum manifest over the downloaded binaries. Generated
      # before signing so it never lists SHA256SUMS itself or its signature.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # -- guards against any future artifact whose name starts with a dash.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless (Sigstore) signature over the checksum manifest: no long-lived
      # key, identity is the workflow's OIDC token, logged to the Rekor
      # transparency log.
      #
      # --bundle, not --output-signature/--output-certificate: cosign now
      # defaults to the new bundle format, which IGNORES those two flags and
      # writes a single bundle to --bundle instead. Passing the old pair alone
      # left --bundle empty and failed with
      #   "signing SHA256SUMS: create bundle file: open : no such file or directory"
      # which silently cost v0.8.1 and v0.9.0 their GitHub Releases (the tag and
      # image jobs run earlier and had already succeeded). See scrim#98.
      #
      # Verify with:
      #   cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
      #     --certificate-identity-regexp \
      #       'https://github.com/jedwards1230/scrim/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS
      - name: Sign checksums (keyless, GitHub OIDC)
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
          # Fail loudly here rather than shipping a release whose signature is
          # missing: the attach step globs dist/*, so an absent bundle would
          # otherwise just produce a quietly unsigned release.
          test -s SHA256SUMS.cosign.bundle

      - name: Compose release body (AI notes)
        env:
          BODY_B64: ${{ needs.prepare.outputs.release_body }}
        run: |
          set -euo pipefail
          # ai-release.yml emits a base64-encoded body to survive Actions' job-output
          # character restrictions; decode before use.
          echo "$BODY_B64" | base64 -d > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: dist/*

      - name: Write workflow summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREV: ${{ needs.prepare.outputs.prev_tag }}
          BUMP_TYPE: ${{ needs.prepare.outputs.bump_type }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${TAG} |"
            echo "| Previous | ${PREV} |"
            echo "| Bump | ${BUMP_TYPE} |"
            # Keep this in sync with the "platforms" list in the build job.
            echo "| Binaries | linux/darwin (amd64 + arm64), windows (amd64) |"
            echo "| Integrity | SHA256SUMS + keyless cosign signature (SHA256SUMS.cosign.bundle) |"
          } >> "$GITHUB_STEP_SUMMARY"
